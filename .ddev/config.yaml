# DDEV configuration for Northern Hills Aerial Services.
# Docs: https://ddev.readthedocs.io/en/stable/users/configuration/config/
name: northern-hills-aerial-services
type: drupal11
docroot: web
php_version: "8.3"
webserver_type: nginx-fpm
xdebug_enabled: false
additional_hostnames: []
additional_fqdns: []
database:
  type: mariadb
  version: "10.11"
use_dns_when_possible: true
composer_version: "2"
nodejs_version: "22"
corepack_enable: false
web_environment: []

# DDEV generates web/sites/default/settings.ddev.php on start. settings.php is
# committed and already includes it, so DDEV leaves settings.php unchanged.
disable_settings_management: false

hooks:
  post-start:
    # Create settings.local.php from the committed template on first start.
    - exec: "[ -f web/sites/default/settings.local.php ] || cp web/sites/default/example.settings.local.php web/sites/default/settings.local.php"
    # Private files directory (outside the web root).
    - exec: "mkdir -p private"
